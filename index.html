<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAR.CHOCO | 디어초코</title>
    <style>
        :root {
            --bg-color: #F7F4EF;
            --card-bg: #FFFFFF;
            --accent-brown: #C8A888;
            --text-main: #2C2523;
            --text-muted: #8C827D;
            --border-color: #E6E0D8;
            --black: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #EFECE6;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 모바일 뷰 프레임 (PC에서도 스마트폰 화면처럼 보이도록 설정) */
        .mobile-frame {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            .mobile-frame {
                border-radius: 24px;
                border: 8px solid #2C2523;
            }
        }

        /* 상단 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            font-size: 20px;
            cursor: pointer;
            color: var(--black);
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--black);
            text-decoration: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .header-icons {
            display: flex;
            gap: 14px;
            font-size: 18px;
            cursor: pointer;
        }

        .header-icons span {
            color: var(--black);
        }

        /* 검색창 토글 영역 */
        .search-container {
            padding: 12px 20px;
            background-color: var(--card-bg);
            display: none;
            border-bottom: 1px solid var(--border-color);
        }

        .search-container.active {
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            font-size: 14px;
            outline: none;
        }

        /* 메인 컨텐츠 스크롤 영역 */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 40px;
        }

        /* 상단 브랜드 슬로건 영역 */
        .brand-intro-section {
            text-align: center;
            padding: 30px 20px 20px 20px;
            background-color: var(--card-bg);
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-name-eng {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--black);
            margin-bottom: 8px;
        }

        .brand-slogan {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* 섹션 공통 스타일 */
        .section {
            padding: 20px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--black);
        }

        /* 인기 도서 가로 슬라이드 (PC 드래그/휠 스크롤 지원) */
        .popular-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
            cursor: grab;
            user-select: none;
        }

        .popular-scroll:active {
            cursor: grabbing;
        }

        .popular-scroll::-webkit-scrollbar {
            display: none;
        }

        .popular-card {
            min-width: 150px;
            width: 150px;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            cursor: pointer;
        }

        .popular-img {
            width: 100%;
            height: 180px;
            background-color: #E2DBD4;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            overflow: hidden;
        }

        .popular-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .popular-info {
            padding: 10px;
        }

        .book-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .rating-box {
            font-size: 11px;
            color: #D4A373;
            margin-bottom: 4px;
        }

        .review-text {
            font-size: 11px;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        /* ALL ITEMS 그리드 (가격, 상태 포함) */
        .all-items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .item-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .item-img {
            width: 100%;
            height: 170px;
            background-color: #E2DBD4;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            overflow: hidden;
        }

        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .item-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .item-price {
            font-size: 13px;
            font-weight: 700;
            color: var(--black);
        }

        .item-grade {
            font-size: 10px;
            background-color: var(--bg-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-brown);
            font-weight: 600;
        }

        /* 하단 푸터 (Footer) - 맨 밑으로 내렸을 때만 표시 */
        footer {
            background-color: #2C2523;
            color: #A39B95;
            padding: 24px 20px;
            font-size: 11px;
            line-height: 1.5;
            margin-top: 20px;
        }

        .footer-logo {
            color: #FFFFFF;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .footer-info p {
            margin-bottom: 4px;
        }

        .footer-copyright {
            margin-top: 16px;
            font-size: 10px;
            color: #6E6560;
            border-top: 1px solid #3F3733;
            padding-top: 12px;
        }

        /* 팝업 모달 (너비 조정으로 글자 잘림 방지) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 90%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--black);
        }

        .modal-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
            word-break: keep-all;
        }

        .modal-btn {
            background-color: var(--black);
            color: #FFFFFF;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 상세 상품 모달 */
        .detail-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 200;
        }

        .detail-modal.active {
            transform: translateY(0);
        }

        .detail-close {
            float: right;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .detail-book-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .detail-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-brown);
            margin-bottom: 12px;
        }

        .detail-intro {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .add-cart-btn {
            background-color: var(--black);
            color: #FFF;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <!-- 상단 헤더 -->
        <header>
            <div class="header-left" onclick="alert('메뉴가 열립니다.')">☰</div>
            <a href="#" class="logo">DEAR.CHOCO</a>
            <div class="header-icons">
                <span id="search-toggle">🔍</span>
                <span onclick="alert('로그인 페이지로 이동합니다.')">👤</span>
                <span onclick="alert('장바구니로 이동합니다.')">🛒</span>
            </div>

        <!-- 검색창 토글 영역 -->
        <div class="search-container" id="search-container">
            <input type="text" class="search-input" placeholder="원하시는 책 제목을 검색해 보세요...">
        </div>

        <!-- 스크롤 컨텐츠 -->
        <div class="content-scroll">
            
            <!-- 브랜드 슬로건 영역 -->
            <div class="brand-intro-section">
                <div class="brand-name-eng">DEAR.CHOCO</div>
                <div class="brand-slogan">소중한 책에 새로운 이야기를 더하세요</div>
            </div>

            <!-- 인기 있는 책 목록 (가격 없음, 에디터 추천 도서 5개 가로 슬라이드) -->
            <div class="section">
                <div class="section-title">요즘 가장 사랑받는 에디터 추천도서</div>
                
                <div class="popular-scroll" id="popular-slider">
                    <!-- 인기 도서 1 -->
                    <div class="popular-card" onclick="openDetail('모든 순간이 너였다', '12,000원', '따뜻한 위로를 건네는 감성 에세이입니다. 마음이 포근해지는 문장들이 가득합니다.')">
                        <div class="popular-img">도서 이미지</div>
                        <div class="popular-info">
                            <div class="book-title">모든 순간이 너였다</div>
                            <div class="rating-box">★★★★★</div>
                            <div class="review-text">"지친 하루 끝에 위로가 되어준 책" - 평론가 김OO</div>
                        </div>
                    </div>
                    <!-- 인기 도서 2 -->
                    <div class="popular-card" onclick="openDetail('달러구트 꿈 백화점', '11,000원', '잠들어야만 입장할 수 있는 신비로운 백화점에서 일어나는 따뜻한 이야기.')">
                        <div class="popular-img">도서 이미지</div>
                        <div class="popular-info">
                            <div class="book-title">달러구트 꿈 백화점</div>
                            <div class="rating-box">★★★★★</div>
                            <div class="review-text">"상상력이 빛을 발하는 힐링 판타지" - 독자 리뷰</div>
                        </div>
                    </div>
                    <!-- 인기 도서 3 -->
                    <div class="popular-card" onclick="openDetail('작은 아씨들', '9,500원', '네 자매의 성장과 따뜻한 가족애를 담은 영원한 고전 명작.')">
                        <div class="popular-img">도서 이미지</div>
                        <div class="popular-info">
                            <div class="book-title">작은 아씨들</div>
                            <div class="rating-box">★★★★☆</div>
                            <div class="review-text">"몇 번을 읽어도 감동적인 인생 책" - 서점 에디터</div>
                        </div>
                    </div>
                    <!-- 인기 도서 4 -->
                    <div class="popular-card" onclick="openDetail('불편한 편의점', '10,500원', '서울 후암동 골목길 작은 편의점에서 벌어지는 가슴 따뜻한 연대기.')">
                        <div class="popular-img">도서 이미지</div>
